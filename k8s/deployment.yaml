apiVersion: apps/v1
kind: Deployment

metadata:
  name: student-api
  namespace: cqrs-lab

spec:
  replicas: 1

  selector:
    matchLabels:
      app: student-api

  template:
    metadata:
      labels:
        app: student-api

    spec:
      containers:
        - name: student-api
          image: localhost/student-api:1.0
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: QUARKUS_PROFILE
              value: prod