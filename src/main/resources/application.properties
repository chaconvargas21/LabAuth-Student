
############################################################
# CONFIGURATION
############################################################

readinessProbe:
    httpGet:
        path: /q/health/ready
        port: 8080
livenessProbe:
    httpGet:
        path: /q/health/live
        port: 8080




############################################################
# WRITE MODEL (COMMAND) - H2
############################################################

quarkus.datasource.command.db-kind=h2
quarkus.datasource.command.jdbc.url=jdbc:h2:tcp://h2-db:9092/~/student-command-db
quarkus.datasource.command.username=sa
quarkus.datasource.command.password=

quarkus.hibernate-orm."command".datasource=command
quarkus.hibernate-orm."command".packages=com.lab.student.command.entity
quarkus.hibernate-orm."command".database.generation=update
quarkus.hibernate-orm."command".log.sql=true

############################################################
# READ MODEL (QUERY) - MongoDB
############################################################

quarkus.mongodb.connection-string=mongodb://mongodb:27017/?retryWrites=false
quarkus.mongodb.database=student-query-db

############################################################
# OPENAPI
############################################################

quarkus.smallrye-openapi.store-schema-directory=target/openapi

############################################################
# TEST
############################################################

%test.quarkus.datasource.command.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm."command".database.generation=drop-and-create

%test.quarkus.mongodb.connection-string=mongodb://localhost:27017
%test.quarkus.mongodb.database=student-query-test